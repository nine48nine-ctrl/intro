<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบัญชี - มจพ.</title>
    <link href="style\language.css" rel="stylesheet">
    <link href="style\base.css" rel="stylesheet">
    <link href="style\account.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>การสมัครเข้าศึกษาต่อ ปีการศึกษา 2570</h2>
    </div>

    <div class="main-content">
        <div class="auth-card">
            <h2>สร้างบัญชี</h2>
            <div class="form-group">
                <label>เลขประจำตัวประชาชน</label>
                <input type="text" placeholder="เลขประจำตัวประชาชน">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" placeholder="ตั้งรหัสผ่าน">
            </div>
            <button class="btn-submit" onclick="register()">ลงทะเบียน</button>
            
            <div class="auth-links">
                <a href="login.html">มีบัญชีผู้ใช้งานแล้ว? กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>

    <div class="footer">ติดต่อเราได้ที่: กองบริการการศึกษา มจพ. | โทร: +66 2 555-2000</div>

    <script>
        function register() {
            alert("สร้างบัญชีสำเร็จ! กรุณาเข้าสู่ระบบ");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
