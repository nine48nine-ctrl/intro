<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำหนดการรับนักศึกษาใหม่ - มจพ.</title>
    <link href="style\language.css" rel="stylesheet">
    <link href="style\base.css" rel="stylesheet">
    <link href="style\schedule.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            font-family: 'Kanit', sans-serif; 
            background-color: #ffffff; 
        }

        /* ขยาย Container ให้เต็มความกว้าง 100% */
        .container { 
            width: 100%; 
            max-width: 100%; 
            margin: 0; 
            background-color: #ffffff; 
        }
        
        /* รูปภาพ Header และ Footer กว้างเต็มจอ */
        img.layout-img { 
            width: 100%; 
            display: block; 
            height: auto; 
        }

        /* --- เมนู --- */
        .main-nav, .sub-nav { 
            display: flex; 
            width: 100%;
            border-bottom: 1px solid #ccc; 
        }
        .main-nav { background-color: #e2e2e2; }
        .sub-nav { background-color: #dcdcdc; padding: 0; border-bottom: none; }
        
        .main-nav a, .sub-nav a { 
            flex: 1; 
            text-align: center; 
            color: #555; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 16px; 
            transition: 0.2s; 
        }
        .main-nav a { padding: 15px 0; border-right: 1px solid #ccc; }
        .main-nav a:last-child { border-right: none; }
        .sub-nav a { padding: 18px 0; color: #666; }
        
        /* แถบที่กำลังเลือก (Active) */
        .sub-nav a.active { background-color: #ffffff; color: #333; font-weight: 600; }
        .main-nav a:hover, .sub-nav a:hover { background-color: #d0d0d0; }
        .dropdown-icon { font-size: 10px; margin-left: 5px; vertical-align: middle; }

        /* --- พื้นที่แสดงรูปภาพกำหนดการตรงกลาง --- */
        .schedule-content { 
            background-color: #ffffff; 
            padding: 50px 20px; 
            display: flex; 
            justify-content: center; 
            min-height: 500px;
            width: 100%;
        }
        .schedule-content img { 
            max-width: 1000px; /* ขยายขนาดการแสดงผลภาพกำหนดการให้สบายตาขึ้น */
            width: 100%; 
            height: auto; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            border-radius: 8px;
        }

        /* ส่วนของกล่องสถานะเข้าสู่ระบบมุมขวาบน */
        .auth-bar {
            position: absolute;
            top: 20px;
            right: 40px;
            z-index: 1000;
        }
        .auth-bar a {
            color: #fff;
            font-family: 'Kanit', sans-serif;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 5px 15px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }
        .auth-bar a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .auth-bar button {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ภาพเฮดเดอร์ด้านบน -->
        <img src="image/header_1.png" alt="Header KMUTNB" class="layout-img">
        
        <!-- แถบเมนูหลัก -->
        <nav class="main-nav">
            <a href="index.html">หน้าแรก</a>
            <a href="announcement.html">ประกาศรายชื่อ <span class="dropdown-icon">▼</span></a>
            <a href="scholarship.html">ทุนการศึกษา <span class="dropdown-icon">▼</span></a>
            <a href="print_doc.html">พิมพ์เอกสาร <span class="dropdown-icon">▼</span></a>
            <a href="contact.html">ติดต่อสอบถาม</a>
        </nav>
        
        <img src="image/header_2_register.png" alt="Banner Apply" class="layout-img">
        
        <!-- แถบเมนูย่อย -->
        <nav class="sub-nav">
            <a href="index.html">ข่าวการรับสมัคร</a>
            <a href="courses.html">กรอกใบสมัคร</a>
            <a href="qualification.html">ตรวจสอบคุณวุฒิ</a>
            <a href="curriculum.html">หลักสูตรการศึกษา</a>
            <a href="schedule.html" >กำหนดการรับนักศึกษาใหม่</a>
        </nav>
        
        <!-- เนื้อหาตรงกลาง แสดงรูป TCAS70 -->
        <div class="schedule-content">
            <img src="image/TCAS70.png" alt="กำหนดการรับสมัครนักศึกษา TCAS 70">
        </div>
        
        <!-- ฟุตเตอร์ด้านล่าง -->
        <img src="image/footer.png" alt="Footer Contact" class="layout-img">
    </div>

<script>
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const username = localStorage.getItem("username");

    let loginDiv = document.createElement("div");
    loginDiv.className = "auth-bar";

    if (isLoggedIn) {
        loginDiv.innerHTML = `
            <span style="color:#fff; font-family:'Kanit'; margin-right:15px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">${username}</span> 
            <button onclick="localStorage.removeItem('isLoggedIn'); window.location.reload();">ออกจากระบบ</button>
        `;
    } else {
        loginDiv.innerHTML = `<a href="login.html">เข้าสู่ระบบ</a>`;
    }
    document.body.appendChild(loginDiv);
</script>
</body>
</html>
