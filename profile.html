<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้สมัคร - มจพ.</title>
    <link href="style\language.css" rel="stylesheet">
    <link href="style\base.css" rel="stylesheet">
    <link href="style\account.css" rel="stylesheet">
    <link href="style\profile.css" rel="stylesheet">
</head>
<body>

    <!-- เฮดเดอร์ -->
    <div class="header">
        <h2>การสมัครเข้าศึกษาต่อ ปีการศึกษา 2570</h2>
        <div class="user-nav">
            <span id="nav-username">นางสาว สมหญิง</span>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="main-container">
        <div class="profile-card">
            
            <!-- รูปโปรไฟล์ Avatar SVG -->
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- รายละเอียดผู้ใช้ -->
            <div class="profile-details">
                <!-- แถบแสดงชื่อและปุ่มแก้ไข -->
                <div class="name-row" id="display-name-group">
                    <span class="name-label" id="profile-name">ชื่อ นางสาว สมหญิง</span>
                    <button class="btn-action" onclick="toggleEdit(true)">แก้ไขชื่อ</button>
                </div>

                <!-- กล่องป้อนข้อมูลสำหรับแก้ไขชื่อ -->
                <div class="edit-group" id="edit-name-group">
                    <input type="text" id="name-input" class="edit-input" placeholder="กรอกชื่อ-นามสกุลใหม่">
                    <button class="btn-save" onclick="saveName()">บันทึก</button>
                    <button class="btn-cancel" onclick="toggleEdit(false)">ยกเลิก</button>
                </div>

                <div class="course-title">หลักสูตรที่สมัคร</div>
                <div class="course-bar"></div>

                <a href="index.html" class="btn-home">กลับสู่หน้าแรก</a>
            </div>

        </div>
    </div>

    <!-- ฟุตเตอร์ -->
    <div class="footer">
        ติดต่อเราได้ที่: กองบริการการศึกษา มจพ.
    </div>

    <!-- สคริปต์จัดการข้อมูล -->
    <script>
        // โหลดชื่อจาก localStorage เมื่อเปิดหน้า
        window.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem("username") || "นางสาว สมหญิง";
            updateNameDisplay(savedName);
        });

        // สลับมุมมองระหว่างแสดงชื่อ กับ กล่องแก้ไข
        function toggleEdit(isEditing) {
            const displayGroup = document.getElementById("display-name-group");
            const editGroup = document.getElementById("edit-name-group");
            const nameInput = document.getElementById("name-input");

            if (isEditing) {
                const currentName = localStorage.getItem("username") || "นางสาว สมหญิง";
                nameInput.value = currentName;
                displayGroup.style.display = "none";
                editGroup.style.display = "flex";
                nameInput.focus();
            } else {
                displayGroup.style.display = "flex";
                editGroup.style.display = "none";
            }
        }

        // บันทึกชื่อใหม่
        function saveName() {
            const nameInput = document.getElementById("name-input");
            const newName = nameInput.value.trim();

            if (newName !== "") {
                localStorage.setItem("username", newName);
                updateNameDisplay(newName);
                toggleEdit(false);
            } else {
                alert("กรุณากรอกชื่อ-นามสกุล");
            }
        }

        // อัปเดตข้อความชื่อในส่วนต่าง ๆ
        function updateNameDisplay(name) {
            document.getElementById("profile-name").textContent = `ชื่อ ${name}`;
            document.getElementById("nav-username").textContent = name;
        }

        // ออกจากระบบ
        function logout() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
